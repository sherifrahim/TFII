server {
    server_name threatintel.mooo.com;

    # Filenames under /ui/static/ are content-hashed by the build (main.<hash>.js),
    # so a given URL can never change meaning. Cache it hard and skip revalidation
    # entirely. Longest-prefix match means this wins over the /ui/ block below.
    location /ui/static/ {
        alias /home/ubuntu/threatfeed-ui/build/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /ui/ {
        alias /home/ubuntu/threatfeed-ui/build/;
        # try_files' last argument is a URI, not a filesystem path — an absolute
        # path here never matches and every unknown /ui/ route 404s instead of
        # falling back to the SPA. /ui/index.html re-enters this block and the
        # alias resolves it. Harmless while routing is state-based, fatal the
        # day real URL routing is added.
        try_files $uri $uri/ /ui/index.html;

        # index.html names the hashed bundles, so a stale copy points at files
        # that no longer exist — a blank app, not just a missing feature. no-cache
        # keeps the copy but forces an ETag revalidation, which is a cheap 304
        # when nothing changed.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/threatintel.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threatintel.mooo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = threatintel.mooo.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name threatintel.mooo.com;
    return 404;
}
