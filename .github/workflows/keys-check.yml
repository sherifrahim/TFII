name: Check platform and admin API keys (manual, read-only)

# Manual only. Runs the same provider check as the Settings "Test" button against (a) the platform keys in
# the server's .env and (b) the admin account's saved keys. Prints "who service status" only; no key value.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/threatfeed && set -a && . ./.env && set +a
            venv/bin/python - <<'PY' 2>&1 | grep -v "^\[WARN\]\|Deprecat\|scheduler"
            import asyncio, main
            async def go():
                print("--- platform keys as .env provides them ---")
                for svc, key in main._ENV_PLATFORM_KEYS.items():
                    if not key: print(f"{svc:11s} not set"); continue
                    r = await main.keycheck.check_key(svc, key)
                    print(f"{svc:11s} {r['status']}")
                main.refresh_platform_keys()
                print("--- platform keys as used now (admin saved key first, .env second) ---")
                for svc, key in main.PLATFORM_KEYS.items():
                    if not key: print(f"{svc:11s} not set"); continue
                    r = await main.keycheck.check_key(svc, key)
                    print(f"{svc:11s} {r['status']}")
                print("--- admin account saved keys ---")
                c = main.get_db_direct(); cu = c.cursor()
                cu.execute("SELECT k.service, k.api_key_encrypted FROM user_api_keys k JOIN users u ON u.id = k.user_id WHERE u.username = 'admin' ORDER BY 1")
                rows = cu.fetchall(); c.close()
                for svc, enc in rows:
                    key = main.decrypt_key(enc)
                    r = await main.keycheck.check_key(svc, key) if key else {"status": "unreadable"}
                    print(f"{svc:11s} {r['status']}")
            asyncio.run(go())
            PY
