name: Probe the deployed UI build and web server headers (manual, read-only)

# Manual only. Shows what the web server is actually serving: build timestamp, whether the download-link fix is
# in the shipped bundle, and the nginx cache/CSP header lines. No secrets are printed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            UI=/home/ubuntu/threatfeed-ui
            echo "=== build dir ==="; ls -la --time-style=full-iso $UI | head -8
            echo "=== index.html asset references + CSP meta ==="
            grep -o 'static/js/[^"]*\|static/css/[^"]*' $UI/build/index.html | head
            grep -o 'Content-Security-Policy[^>]*' $UI/build/index.html | head -2 | cut -c1-400
            echo "=== does any shipped JS carry the blob-download allowance? (own-origin blob: check) ==="
            grep -l 'startsWith("blob:"' $UI/build/static/js/*.js 2>/dev/null | head; echo "(count: $(grep -l 'startsWith("blob:"' $UI/build/static/js/*.js 2>/dev/null | wc -l))"
            echo "=== does it still carry the old guard only? (link guard regex without blob) ==="
            grep -c 'https?:|mailto:' $UI/build/static/js/*.js 2>/dev/null | grep -v ':0' | head
            echo "=== CSV export columns in shipped JS ==="
            grep -l 'location_kind' $UI/build/static/js/*.js 2>/dev/null | head; grep -l 'tld_registry_country' $UI/build/static/js/*.js 2>/dev/null | head
            echo "=== nginx: cache / CSP / header lines for this site ==="
            sudo grep -rhE 'add_header|expires|Cache-Control|Content-Security|location |try_files|root |alias ' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | sed 's/^[ \t]*//' | head -40
            echo "=== headers actually served for the UI entry and a chunk (via localhost) ==="
            curl -skI -H "Host: $(sudo grep -rhoE 'server_name +[^; ]+' /etc/nginx/sites-enabled/ 2>/dev/null | head -1 | awk '{print $2}')" https://127.0.0.1/ui/ | grep -iE '^(HTTP|cache-control|expires|etag|last-modified|content-security-policy|content-type)' | cut -c1-300
