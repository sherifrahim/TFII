name: Deploy TFII

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Nothing ships unless the suites pass: API/authz/SSRF/entity tests against a
  # real PostgreSQL, then UI lint + unit tests. The backend suite creates and
  # drops its own throwaway database.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tfii
          POSTGRES_PASSWORD: tfii-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfii" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: tfii
      DB_PASS: tfii-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and unit tests
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx eslint src --ext .js --max-warnings 0
          CI=true npm test

  deploy:
    needs: test
    # One deploy at a time. Every run uploads to, extracts in and finally deletes the same folder on the server,
    # so two overlapping runs (a second push within ~3 minutes) destroyed each other's files and failed with
    # "exit status 1" right after "Repo updated" - which left the newest commits undeployed. Queued runs wait;
    # a run still waiting when a newer push arrives is dropped, and the newer one ships everything (the server
    # checkout is reset to origin/master and the artifact is built from that commit).
    concurrency:
      group: tfii-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The UI is built here, never on the server: the host has ~956MB RAM and
      # `npm run build` there wedges the whole machine (see deploy/README.md).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"   # never publish source maps
        run: |
          npm ci --legacy-peer-deps
          # config.js falls back to the page origin, which is where the API is
          # served, so no domain substitution is needed for this deployment.
          npm run build
          test -f build/index.html

      - name: Check backend compiles
        run: python3 -m py_compile backend/*.py

      - name: Package release
        run: |
          mkdir -p release/backend
          cp -r frontend/build release/build
          cp backend/*.py release/backend/
          tar czf tfii-release.tar.gz -C release .

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: tfii-release.tar.gz
          target: /tmp/tfii-deploy

      - name: Install on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            # Trace every command (no secrets are used in this script): a step that exits silently otherwise leaves
            # only "Process exited with status 1" and no hint which one it was.
            set -x
            echo "=== TFII Deploy at $(date) ==="

            # Keep the server-side checkout current (scripts, docs, configs).
            sudo chown -R ubuntu:ubuntu /home/ubuntu/threatfeed-repo 2>/dev/null || true
            git config --global --add safe.directory /home/ubuntu/threatfeed-repo 2>/dev/null || true
            cd /home/ubuntu/threatfeed-repo && git fetch origin master && git reset --hard origin/master
            echo "✓ Repo updated"

            D=/tmp/tfii-deploy
            rm -rf "$D/x" && mkdir -p "$D/x"
            tar xzf "$D/tfii-release.tar.gz" -C "$D/x"
            test -f "$D/x/build/index.html"

            # ── Backend: every module ships together; roll back if health fails
            APP=/home/ubuntu/threatfeed
            BACKEND_CHANGED=false
            for f in "$D"/x/backend/*.py; do
              if ! diff -q "$f" "$APP/$(basename "$f")" > /dev/null 2>&1; then BACKEND_CHANGED=true; fi
            done
            if [ "$BACKEND_CHANGED" = true ]; then
              "$APP/venv/bin/python" -m py_compile "$D"/x/backend/*.py
              "$APP/venv/bin/pip" install -r /home/ubuntu/threatfeed-repo/backend/requirements.txt --quiet
              BK="$HOME/backend.pre-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "$BK" && cp "$APP"/*.py "$BK"/
              cp "$D"/x/backend/*.py "$APP"/
              sudo systemctl restart threatfeed
              sleep 8
              if curl -sf http://127.0.0.1:8000/health > /dev/null; then
                echo "✓ Backend deployed and healthy (backup: $BK)"
              else
                echo "✗ Backend unhealthy — rolling back to $BK"
                sudo journalctl -u threatfeed -n 30 --no-pager || true
                cp "$BK"/*.py "$APP"/
                sudo systemctl restart threatfeed
                exit 1
              fi
            else
              echo "~ Backend unchanged"
            fi

            # ── Frontend: staged swap, previous build kept for one-mv rollback
            UI=/home/ubuntu/threatfeed-ui
            sudo chown -R root:root "$D/x/build"
            sudo rm -rf "$UI/build.old"
            if [ -d "$UI/build" ]; then sudo mv "$UI/build" "$UI/build.old"; fi
            sudo mv "$D/x/build" "$UI/build"
            echo "✓ Frontend deployed (rollback: sudo rm -rf $UI/build && sudo mv $UI/build.old $UI/build)"

            rm -rf "$D"
            echo "=== Done ==="
