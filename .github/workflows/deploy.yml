name: Deploy TFII

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=== TFII Deploy at $(date) ==="

            sudo chown -R ubuntu:ubuntu /home/ubuntu/threatfeed-repo 2>/dev/null || true
            git config --global --add safe.directory /home/ubuntu/threatfeed-repo 2>/dev/null || true

            cd /home/ubuntu/threatfeed-repo
            git fetch origin master && git reset --hard origin/master
            echo "✓ Code pulled"

            # The backend is main.py plus sibling modules (intel_api.py, …);
            # main.py imports them, so every *.py must ship together.
            BACKEND_CHANGED=false
            for f in backend/*.py; do
              if ! diff -q "$f" "/home/ubuntu/threatfeed/$(basename "$f")" > /dev/null 2>&1; then
                BACKEND_CHANGED=true
              fi
            done
            if [ "$BACKEND_CHANGED" = true ]; then
              /home/ubuntu/threatfeed/venv/bin/python -m py_compile backend/*.py
              cp backend/*.py /home/ubuntu/threatfeed/
              source /home/ubuntu/threatfeed/venv/bin/activate
              pip install -r backend/requirements.txt --quiet
              sudo systemctl restart threatfeed
              sleep 3
              if sudo systemctl is-active --quiet threatfeed; then
                echo "✓ Backend deployed and running"
              else
                sudo journalctl -u threatfeed -n 20 --no-pager
                exit 1
              fi
            else
              echo "~ Backend unchanged"
            fi

            # Restore real domain before copying frontend
            REAL_DOMAIN=$(grep "^SERVER_URL" /home/ubuntu/threatfeed/.env | cut -d= -f2 | sed 's|https://||')
            if [ -z "$REAL_DOMAIN" ]; then REAL_DOMAIN="threatintel.mooo.com"; fi
            # The UI is a multi-file source tree now (App.js → Root.js, pages/,
            # components/, legacy/). Stage it with the real domain substituted
            # into config.js, then sync the whole tree.
            rm -rf /tmp/tfii-src && cp -r frontend/src /tmp/tfii-src
            sed -i "s|YOUR_DOMAIN|${REAL_DOMAIN}|g" /tmp/tfii-src/config.js

            FRONTEND_CHANGED=false
            if ! diff -rq /tmp/tfii-src /home/ubuntu/threatfeed-ui/src > /dev/null 2>&1; then
              rsync -a --delete /tmp/tfii-src/ /home/ubuntu/threatfeed-ui/src/
              FRONTEND_CHANGED=true
              echo "✓ Updated: frontend/src"
            fi
            for f in frontend/public/index.html; do
              dest="/home/ubuntu/threatfeed-ui/${f#frontend/}"
              if ! diff -q "$f" "$dest" > /dev/null 2>&1; then
                cp "$f" "$dest"
                FRONTEND_CHANGED=true
                echo "✓ Updated: $f"
              fi
            done

            if [ "$FRONTEND_CHANGED" = true ]; then
              cd /home/ubuntu/threatfeed-ui && npm run build
              echo "✓ Frontend built"
            else
              echo "~ Frontend unchanged"
            fi

            echo "=== Done ==="
