name: Probe the NSLookup.io API from the server (manual, read-only)

# Manual only. Prints real sample responses of the public NSLookup.io DNS API (no key, no credentials) so the
# parser is written against the actual format. A handful of requests only: the API allows 30 per minute per IP.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to look up"
        default: "github.com"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOMAIN: ${{ github.event.inputs.domain }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: DOMAIN
          script: |
            cd /home/ubuntu/threatfeed
            DOMAIN="$DOMAIN" venv/bin/python - <<'PY'
            import json, os, time, httpx
            d = os.environ["DOMAIN"]
            def get(path, **kw):
                r = httpx.get("https://www.nslookup.io" + path, timeout=25, headers={"User-Agent": "TFII/1.0"}, **kw)
                return r
            def shape(x, depth=0):
                if isinstance(x, dict): return {k: shape(v, depth + 1) for k, v in list(x.items())[:14]}
                if isinstance(x, list): return [shape(x[0], depth + 1), f"...{len(x)} items"] if x else []
                return x if not isinstance(x, str) else (x[:60] + ("..." if len(x) > 60 else ""))
            r = get("/api/v1/records", params={"domain": d, "server": "cloudflare"})
            j = r.json()
            print("=== records: HTTP", r.status_code, "top-level keys:", list(j))
            recs = j.get("records", {})
            print("record type keys:", list(recs))
            for t, v in recs.items():
                q = v.get("query") if isinstance(v, dict) else None
                resp = (v.get("response") or {}) if isinstance(v, dict) else {}
                ans = resp.get("answer") or []
                print(f"--- {t}: keys={list(v) if isinstance(v, dict) else type(v).__name__} rCode={resp.get('rCode')} n_answers={len(ans)}")
                if ans:
                    print("   first answer:", json.dumps(shape(ans[0]))[:700])
            for typ in ("CAA", "SPF", "MX"):
                time.sleep(2)
                r = get("/api/v1/records/other", params={"domain": d, "type": typ, "server": "cloudflare"})
                j = r.json()
                ans = ((j.get("queryResult") or {}).get("response") or {}).get("answer") or []
                print(f"=== other {typ}: HTTP {r.status_code} top-level keys={list(j)} n_answers={len(ans)}")
                for a in ans[:2]:
                    print("   answer:", json.dumps(shape(a))[:900])
                if typ == "SPF":
                    print("   extra top-level:", json.dumps({k: shape(v) for k, v in j.items() if k not in ("queryResult",)})[:1500])
            time.sleep(2)
            r = get("/api/v1/records/other", params={"domain": "8.8.8.8", "type": "PTR", "server": "cloudflare"})
            j = r.json()
            print("=== other PTR (ip):", r.status_code, json.dumps(shape(((j.get("queryResult") or {}).get("response") or {}).get("answer") or []))[:600])
            time.sleep(2)
            r = get("/api/v1/records/other", params={"domain": "doesnotexist-tfii-zz.com", "type": "A", "server": "cloudflare"})
            j = r.json()
            print("=== other A nxdomain:", r.status_code, "rCode:", (((j.get("queryResult") or {}).get("response") or {}).get("rCode")), "keys:", list(j))
            PY
