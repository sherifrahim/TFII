name: Server diagnostics (read-only)

# Manual only. Prints migration state and recent backend errors so a production
# 500 can be diagnosed without shell access. Reads nothing but log lines that
# mention migrations/tracebacks and the schema_migrations table; prints no secrets.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "=== python ==="; /home/ubuntu/threatfeed/venv/bin/python --version
            echo "=== migration log lines ==="
            sudo journalctl -u threatfeed --no-pager -o cat | grep -E "\[migrations\]|\[entities\]|\[search\]|\[upstream\]" | tail -30 || true
            echo "=== recent tracebacks (last 3, bearer/authorization lines dropped) ==="
            sudo journalctl -u threatfeed --no-pager -o cat | grep -v -i "bearer\|authorization" | grep -B3 -A22 "Traceback" | tail -110 || true
            echo "=== schema_migrations + key columns ==="
            cd /home/ubuntu/threatfeed && set -a && . ./.env && set +a
            export PGPASSWORD="$DB_PASS"
            psql -h "${DB_HOST:-localhost}" -U "$DB_USER" "$DB_NAME" -c "SELECT version, name FROM schema_migrations ORDER BY 1" || true
            psql -h "${DB_HOST:-localhost}" -U "$DB_USER" "$DB_NAME" -At -c "SELECT table_name||'.'||column_name||' '||data_type FROM information_schema.columns WHERE (table_name='iocs' AND column_name IN ('analyst_status','last_seen','enrichment')) OR (table_name='investigation_items' AND column_name='reason') ORDER BY 1" || true
            psql -h "${DB_HOST:-localhost}" -U "$DB_USER" "$DB_NAME" -At -c "SELECT tablename FROM pg_tables WHERE tablename IN ('entity_relationships','entity_observations','mitre_cache')" || true
