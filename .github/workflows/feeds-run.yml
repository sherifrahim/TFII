name: Enable and run IOC feeds (manual)

# Manual only. Turns on the chosen feeds in the production settings and runs each once
# using the server's own environment (platform keys never leave the server).
# Prints per-feed counts only.
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "Comma-separated feed ids to enable and run"
        default: "feodo,openphish,ipsum,cins,et_compromised,blocklist_de"
      threatfox_days:
        description: "Optional: pull this many days (1-7) of ThreatFox for this run only (backfill); the saved setting is restored afterwards"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Enable and run
        uses: appleboy/ssh-action@v1.0.3
        env:
          FEEDS: ${{ github.event.inputs.feeds }}
          TF_DAYS: ${{ github.event.inputs.threatfox_days }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: FEEDS,TF_DAYS
          command_timeout: 25m
          script: |
            cd /home/ubuntu/threatfeed && set -a && . ./.env && set +a
            FEEDS="$FEEDS" TF_DAYS="$TF_DAYS" venv/bin/python - <<'PY' 2>&1 | grep -v "^\[WARN\]\|DeprecationWarning\|scheduler"
            import asyncio, json, os
            import main
            main.refresh_platform_keys()   # platform calls use the admin's saved keys first
            ids = [x.strip() for x in os.environ["FEEDS"].split(",") if x.strip()]
            conn = main.get_db_direct()
            cfg = main._connector_cfg(conn)
            cfg.setdefault("feeds", {})
            saved_days = cfg.get("threatfox_days", 1)
            if os.environ.get("TF_DAYS", "").strip().isdigit():
                cfg["threatfox_days"] = max(1, min(7, int(os.environ["TF_DAYS"])))
                print("threatfox backfill days:", cfg["threatfox_days"], "(saved setting:", saved_days, ")")
            for f in ids:
                if f not in main.feeds.FEEDS and f not in main.ABUSECH:
                    print("unknown feed", f); continue
                if f in main.ABUSECH:
                    cfg[main.ABUSECH[f][4]] = True
                else:
                    cfg["feeds"].setdefault(f, {})["enabled"] = True
            cfg.setdefault("min_confidence", 70)
            cfg["enrich_per_run"] = min(int(cfg.get("enrich_per_run", 8)), 5)
            cur = conn.cursor()
            cur.execute("INSERT INTO system_settings (key,value) VALUES (%s,%s) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value",
                        (main.CONNECTOR_SETTINGS_KEY, json.dumps(cfg)))
            conn.commit(); conn.close()
            print("enabled:", ids)
            # one-off correction of IPsum double counting (idempotent)
            c = main.get_db_direct()
            print("repair:", main.feeds.repair_overcounted(c, main.record_score, int(cfg.get("min_confidence", 70)))); c.close()
            # run as the admin account (same as pressing Run in Platform -> Connectors), so its own saved keys apply
            c = main.get_db_direct(); cu = c.cursor(); cu.execute("SELECT id, role FROM users WHERE username = 'admin'"); r = cu.fetchone(); c.close()
            admin = {"id": r[0], "role": r[1]}
            done_groups = set()
            for f in ids:
                if f in main.feeds.FEEDS and main.feeds.FEEDS[f].group == "consensus":
                    if "consensus" in done_groups:
                        continue
                    done_groups.add("consensus")
                asyncio.run(main._run_feed_job(f, admin))
                c = main.get_db_direct(); cu = c.cursor()
                cu.execute("SELECT value FROM system_settings WHERE key = %s", ("connector_last_run_" + f,))
                r = cu.fetchone(); c.close()
                res = json.loads(r[0]) if r else {}
                print(f"{f:16s} ok={res.get('ok')} new={res.get('added')} seen_again={res.get('skipped')} received={res.get('total_received')} "
                      f"below_floor={res.get('below_floor')} enriched={res.get('enriched')} err={str(res.get('error') or res.get('errors') or '')[:160]}")
            if cfg.get("threatfox_days") != saved_days:      # a backfill is for this run only
                cc = main.get_db_direct(); cur2 = cc.cursor(); c2 = main._connector_cfg(cc); c2["threatfox_days"] = saved_days
                cur2.execute("INSERT INTO system_settings (key,value) VALUES (%s,%s) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value",
                             (main.CONNECTOR_SETTINGS_KEY, json.dumps(c2)))
                cc.commit(); cc.close(); print("threatfox_days restored to", saved_days)
            c = main.get_db_direct(); cu = c.cursor()
            cu.execute("SELECT enrichment->>'source', COUNT(*), COUNT(*) FILTER (WHERE confidence>=80), ROUND(AVG(confidence)) FROM iocs GROUP BY 1 ORDER BY 2 DESC LIMIT 12")
            print("source | iocs | conf>=80 | avg conf")
            for row in cu.fetchall(): print(" | ".join(str(x) for x in row))
            cu.execute("SELECT COUNT(*) FROM iocs WHERE enrichment ? 'corroborated_by'")
            print("corroborated (multi-source) indicators:", cu.fetchone()[0])
            PY
