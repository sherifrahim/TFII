server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/tfii-security-headers.conf;

    # ── Built UI ──────────────────────────────────────────────────────────────
    # Files under /ui/static/ have content-hashed names (main.<hash>.js), so a URL never changes meaning and can be
    # cached for a year. This must be a prefix location: with a regex location, `alias` needs a capture group,
    # otherwise nginx builds the wrong file path and every script and stylesheet redirects instead of loading.
    location /ui/static/ {
        alias /usr/share/nginx/html/ui/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/tfii-security-headers.conf;
        access_log off;
    }

    # index.html names the hashed bundles, so it must be revalidated on every load; otherwise the first page
    # after an upgrade points at files that no longer exist.
    location /ui/ {
        alias /usr/share/nginx/html/ui/;
        try_files $uri $uri/ /ui/index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/tfii-security-headers.conf;
    }

    # ── FastAPI backend (everything else) ─────────────────────────────────────
    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # The file store takes up to MAX_FILE_MB (100 by default); nginx's own default would answer 413 first.
        client_max_body_size 100M;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Redirect root → frontend
    location = / {
        return 301 /ui/;
    }
}
