# Included by app.conf in the server block and in every location that sets its own add_header. nginx drops
# headers inherited from the server block as soon as a location sets any add_header of its own, so each such
# location has to include this file again.
add_header X-Frame-Options        "SAMEORIGIN"                        always;
add_header X-Content-Type-Options "nosniff"                           always;
add_header X-XSS-Protection       "1; mode=block"                     always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
