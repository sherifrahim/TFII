<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070e" />
    <meta name="description" content="TFII — ThreatFeed Intelligence Platform" />
    <!-- The UI is served as static files under /ui/ and talks only to its own
         origin. This CSP is what limits the damage of any injected markup: no
         inline/remote script, no framing tricks, no third-party connections.
         (frame-ancestors can't be set from a meta tag; nginx sends
         X-Frame-Options for that.) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>TFII — ThreatFeed Intelligence</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
